<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">

  <link rel="stylesheet" type="text/css" href="./style.css">
</head>

<body>
  <div id="main-title">
    <h3>Calculation Thing</h3>
  </div>

  <div id="input-container">
    <form id="input-form">
      <div class="form-group">
        <label for="ultimate-stress">Ultimate Stress</label>
        <input type="text" id="ultimate-stress" placeholder="Enter ultimate stress value...">

        <label for="yield-stress">Yield stress</label>
        <input type="text" id="yield-stress" placeholder="Enter yield stress value...">

        <label for="size">Size</label>
        <select id="size">
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12">12</option>
          <option value="16">16</option>
          <option value="20">20</option>
          <option value="25">25</option>
          <option value="32">32</option>
        </select>
      </div>

      <div class="form-group">
        <label for="ultimate-load">Ultimate Load</label>
        <input type="text" id="ultimate-load" readonly="true" placeholder="0">

        <label for="yield-load">Yield Load</label>
        <input type="text" id="yield-load" readonly="true" placeholder="0">

        <label for="elongation">Elongation</label>
        <input type="text" id="elongation" readonly="true" placeholder="0">
      </div>

      <div class="form-group">
        <input type="submit" id="submit-button" value="Calculate">
      </div>
    </form>
  </div>

  <script src="./index.js"></script>
</body>

</html>
